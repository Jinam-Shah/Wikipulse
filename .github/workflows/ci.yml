name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint + import order)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .
      - name: Pytest
        run: pytest

  compose-smoke:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate compose file (all profiles)
        run: docker compose --profile pipeline --profile airflow --profile tools config --quiet
      - name: Build pipeline image
        run: docker compose --profile pipeline build producer
      - name: Start core services
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test
        run: python scripts/smoke_test.py --wait 120
      - name: Create and list a test topic
        run: |
          docker exec wikipulse-redpanda rpk topic create ci-smoke
          docker exec wikipulse-redpanda rpk topic list
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Integration tests (Redpanda, Postgres, Iceberg, dbt)
        run: pytest -m integration
      - name: Lakehouse on synthetic data (export -> Iceberg -> dbt build)
        run: |
          python -m wikipulse.devtools.sample --hours 4
          python -m wikipulse.lake run --hours 4
          python -m wikipulse.lake status
          python -m wikipulse.lake dbt build
          python -m wikipulse.lake dbt source freshness
      - name: Postgres has both databases
        run: |
          docker exec wikipulse-postgres psql -U wikipulse -d wikipulse -tAc \
            "select datname from pg_database where datname in ('wikipulse','airflow') order by 1"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

# WikiPulse - full streaming mode (local Docker)
#
# Core services (always start):   redpanda, redpanda-console, postgres
# Pipeline (opt-in):                docker compose --profile pipeline up -d --build
#   = producer + stream processor + Prometheus (http://localhost:9090)
# Airflow (opt-in, needs ~4 GB RAM): docker compose --profile airflow up -d
# Dev tools (tests, lakehouse, dbt in Linux): docker compose run --rm dev <command>
#
# Every port and password can be overridden from .env (see .env.example).

x-airflow-common: &airflow-common
  # Airflow + WikiPulse in its own virtualenv (Dockerfile.airflow, docs/DECISIONS.md D-024).
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: wikipulse-airflow:dev
  profiles: ["airflow"]
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    # Local development only: everyone is admin, no login screen.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-wikipulse}:${POSTGRES_PASSWORD:-wikipulse}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-me-local-only}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Services inside the compose network reach each other by service name.
    WIKIPULSE_KAFKA_BOOTSTRAP: redpanda:9092
    WIKIPULSE_DATABASE_URL: postgresql://${POSTGRES_USER:-wikipulse}:${POSTGRES_PASSWORD:-wikipulse}@postgres:5432/${POSTGRES_DB:-wikipulse}
    WIKIPULSE_WIKIS: ${WIKIPULSE_WIKIS:-enwiki}
    WIKIPULSE_LAKE_DIR: /opt/wikipulse/data/lake
    WIKIPULSE_DBT_DIR: /opt/wikipulse/dbt
    # dbt writes its build output to the shared volume; the project itself is read-only.
    DBT_TARGET_PATH: /opt/wikipulse/data/dbt/target
    DBT_LOG_PATH: /opt/wikipulse/data/dbt/logs
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    # Live code: edits on your machine are used by the next task run, no rebuild needed
    # (rebuild only when pyproject.toml dependencies change).
    - ./src:/opt/wikipulse/src:ro
    - ./dbt:/opt/wikipulse/dbt:ro
    # Same lake as the dev container.
    - lake-data:/opt/wikipulse/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-v26.1.20}
    container_name: wikipulse-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --default-log-level=warn
      # Internal listener for containers, external listener for your laptop.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${REDPANDA_KAFKA_PORT:-19092}
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${REDPANDA_KAFKA_PORT:-19092}:19092"
      - "18081:18081"
      - "18082:18082"
      - "${REDPANDA_ADMIN_PORT:-19644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:${REDPANDA_CONSOLE_VERSION:-v3.14.0}
    container_name: wikipulse-redpanda-console
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8088}:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: wikipulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wikipulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wikipulse}
      POSTGRES_DB: ${POSTGRES_DB:-wikipulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on first start only: creates the separate "airflow" database.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------------------- Pipeline
  producer:
    build: .
    image: wikipulse-pipeline:dev
    container_name: wikipulse-producer
    profiles: ["pipeline"]
    command: ["python", "-m", "wikipulse.producer"]
    environment:
      WIKIPULSE_KAFKA_BOOTSTRAP: redpanda:9092
      WIKIPULSE_CONTACT: ${WIKIPULSE_CONTACT:-https://github.com/jinam-shah/wikipulse/issues}
      WIKIPULSE_WIKIS: ${WIKIPULSE_WIKIS:-enwiki}
      WIKIPULSE_NAMESPACES: ${WIKIPULSE_NAMESPACES:-0}
      WIKIPULSE_CHECKPOINT_PATH: /app/data/checkpoints/producer.json
    volumes:
      # Named volume so the resume checkpoint survives container restarts.
      - producer-state:/app/data
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  processor:
    build: .
    image: wikipulse-pipeline:dev
    container_name: wikipulse-processor
    profiles: ["pipeline"]
    # Applies DB migrations on start (safe to repeat), then consumes forever.
    command: ["python", "-m", "wikipulse.processor"]
    environment:
      WIKIPULSE_KAFKA_BOOTSTRAP: redpanda:9092
      WIKIPULSE_DATABASE_URL: postgresql://${POSTGRES_USER:-wikipulse}:${POSTGRES_PASSWORD:-wikipulse}@postgres:5432/${POSTGRES_DB:-wikipulse}
      WIKIPULSE_RETENTION_DAYS: ${WIKIPULSE_RETENTION_DAYS:-7}
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      producer:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.16.0}
    container_name: wikipulse-prometheus
    profiles: ["pipeline"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Lets Prometheus reach processes you run directly on your machine (Linux needs this;
      # Docker Desktop on Windows/macOS provides it already).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # -------------------------------------------------------------- Dev tools
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: wikipulse-dev:dev
    profiles: ["tools"]
    working_dir: /app
    # Same user as Airflow, so files either one writes in the shared lake volume stay
    # writable by the other. On Linux set AIRFLOW_UID to your own uid (`id -u`).
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      HOME: /tmp
      WIKIPULSE_KAFKA_BOOTSTRAP: redpanda:9092
      WIKIPULSE_DATABASE_URL: postgresql://${POSTGRES_USER:-wikipulse}:${POSTGRES_PASSWORD:-wikipulse}@postgres:5432/${POSTGRES_DB:-wikipulse}
      # Same path as in Airflow: Iceberg metadata stores absolute file paths, so every
      # container that reads the lake must mount it at the same place (D-028).
      WIKIPULSE_LAKE_DIR: /opt/wikipulse/data/lake
      WIKIPULSE_CONTACT: ${WIKIPULSE_CONTACT:-https://github.com/jinam-shah/wikipulse/issues}
    volumes:
      - .:/app
      # The lake (SQLite catalog, DuckDB file, Parquet) lives in a Docker volume rather
      # than on the Windows bind mount, where SQLite/DuckDB file locking is unreliable.
      - lake-data:/opt/wikipulse/data
    depends_on:
      lake-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy

  lake-init:
    # One-shot, as root: make the shared lake volume belong to the dev/Airflow user
    # (fixes volumes created by earlier versions, where the dev container ran as root).
    image: wikipulse-dev:dev
    profiles: ["tools"]
    user: "0:0"
    command: ["sh", "-c", "chown -R ${AIRFLOW_UID:-50000}:0 /opt/wikipulse/data"]
    volumes:
      - lake-data:/opt/wikipulse/data
    restart: "no"

  # ---------------------------------------------------------------- Airflow
  airflow-init:
    <<: *airflow-common
    # As root: give the Airflow user the shared lake volume, migrate Airflow's DB, and
    # create the one-slot "lake" pool that serialises lake writes.
    command:
      - bash
      - -c
      - |
        set -e
        mkdir -p /opt/wikipulse/data
        chown -R ${AIRFLOW_UID:-50000}:0 /opt/wikipulse/data
        airflow db migrate
        airflow pools set lake 1 "Serialises writes to the Iceberg lake and DuckDB marts"
        airflow version
    user: "0:0"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  redpanda-data:
  postgres-data:
  producer-state:
  prometheus-data:
  lake-data:

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wikipulse"
version = "0.0.1"
description = "Real-time Wikipedia intelligence platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Jinam Shah" }]
# Runtime dependencies are added phase by phase.
dependencies = [
  "alembic>=1.20,<2",
  "confluent-kafka>=2.16,<3",
  "dbt-core>=1.11,<2",
  "dbt-duckdb>=1.11,<2",
  # Capped below the newest major releases: Windows Smart App Control blocked the
  # brand-new pyarrow 26 DLLs on a dev machine (docs/DECISIONS.md D-022).
  "duckdb>=1.4,<2",
  "httpx>=0.28,<1",
  "lightgbm>=4.5,<5",
  # skinny = tracking client only (no web server); logs to a local SQLite database.
  "mlflow-skinny>=3.5,<4",
  "pandas>=2.2,<4",
  "prometheus-client>=0.26,<1",
  "psycopg[binary]>=3.3,<4",
  "pyarrow>=20,<26",
  "pydantic>=2.14,<3",
  "scikit-learn>=1.6,<2",
  # pyiceberg-core: Rust transforms needed to write partitioned tables.
  "pyiceberg[sql-sqlite,pyarrow,pyiceberg-core]>=0.12,<0.13",
  "sqlalchemy>=2.1,<3",
]

[project.scripts]
wikipulse-producer = "wikipulse.producer.main:cli"
wikipulse-processor = "wikipulse.processor.main:cli"
wikipulse-db = "wikipulse.db.__main__:main"
wikipulse-lake = "wikipulse.lake.__main__:main"
wikipulse-radar = "wikipulse.radar.main:cli"
wikipulse-train = "wikipulse.ml.train:main"
wikipulse-score = "wikipulse.ml.score:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wikipulse.db" = ["migrations/*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need the docker compose stack; run them with: pytest -m integration
addopts = "-q -m 'not integration'"
markers = [
  "integration: needs the docker compose stack running (skipped by default in unit runs)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "airflow/dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
